# .forgejo/workflows/lock-bump.yml
#
# Self-hosted Renovate: once a week, bump every flake input EXCEPT the pinned
# nixpkgs-mgmt, build every host on the new lock, and open a PR for review. No
# auto-merge -- you read the closure diff (especially the kernel) and merge by
# hand, exactly like the manual `nix flake update` flow in MAINTENANCE.md.
#
# Why nixpkgs-mgmt is held: it's frozen so the first Colmena cut to mgmt is a
# no-op (no package churn -> no DNS/PKI/SIEM restarts). Bumping it is a separate,
# deliberate, in-a-window operation, never an automated PR.
#
# Auth: the per-run token Forgejo Actions injects as secrets.GITHUB_TOKEN -- no
# new secret. The repo must let Actions write: Settings -> Actions gives the run
# token read+write, and "Allow Forgejo Actions to create Pull Requests" is on.
name: flake-lock-bump

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00
  workflow_dispatch:

concurrency:
  group: flake-lock-bump
  cancel-in-progress: true

jobs:
  update:
    runs-on: nix
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: nix flake update (holding the pinned mgmt input)
        id: bump
        run: |
          # The input list is DERIVED, not written out. It used to be hardcoded
          # with a comment asking whoever edited flake.nix to keep it in sync,
          # and by 2026-07-25 four inputs had quietly stopped being updated:
          # isc, newspaper, nix-minecraft and nixvim-stable. A list that must be
          # manually kept in sync eventually is not.
          #
          # nixpkgs-mgmt is excluded because it is frozen on purpose - mgmt runs
          # the LAN's DNS and PKI, and package churn there is a deliberate,
          # in-a-window decision, never an automated PR.
          inputs=$(nix flake metadata --json \
            | jq -r '.locks.nodes.root.inputs | keys[]' \
            | grep -vx 'nixpkgs-mgmt' \
            | tr '\n' ' ')
          echo "updating: $inputs"
          nix flake update $inputs
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: push the bump branch
        if: steps.bump.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "actions@git.mgmt.lan"
          git switch -C automated/flake-lock-bump
          git commit -am "chore(flake): weekly flake.lock bump (nixpkgs-mgmt held)"
          git -c http.extraheader="Authorization: token ${TOKEN}" \
            push -f "${SERVER}/${REPO}.git" "HEAD:automated/flake-lock-bump"

  # Reuse the same host set CI's build-hosts matrix uses: prove the bump builds
  # on every host before any PR is opened. Keep this list in sync with ci.yml.
  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        host: [cloud1, hacktop, media, mgmt, nixos-kde, playground]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automated/flake-lock-bump
      - name: build ${{ matrix.host }}
        run: |
          nix build --print-build-logs --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # Only reached if every host built (needs: build, which fails if any leg did).
  open-pr:
    needs: build
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: open a PR (or note the existing one)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          api="${SERVER}/api/v1/repos/${REPO}/pulls"
          body='Automated weekly `nix flake update` with **nixpkgs-mgmt held** (its pin is deliberate). Every host built green on this branch. Review the closure diff before merging -- no auto-merge.'
          payload=$(jq -n --arg body "$body" '{
            head: "automated/flake-lock-bump",
            base: "main",
            title: "chore(flake): weekly flake.lock bump",
            body: $body
          }')
          code=$(curl -sS -o /tmp/pr.json -w '%{http_code}' -X POST "$api" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          if [ "$code" = "201" ]; then
            echo "PR opened."
          elif grep -qi "already exist" /tmp/pr.json; then
            echo "PR already open; the force-push updated it."
          else
            echo "PR create failed (HTTP $code):"; cat /tmp/pr.json; exit 1
          fi

  # What does this bump actually buy? The PR above says every host built; it does
  # not say whether anything got safer. isc scans the built closure of every host
  # before and after the bump and posts the difference, so the answer is measured
  # rather than inferred from changelogs: "closes CVE-X" means the vulnerable
  # package is gone from the closure that would actually be deployed.
  #
  # Both scans happen in this one job, so isc's findings database being ephemeral
  # in CI does not matter - nothing needs to outlive the run.
  #
  # Never fails the workflow. A missing comment is a worse outcome than a merged
  # bump, but a red pipeline over a scanner hiccup would train everyone to ignore
  # it, so this is advisory by design.
  vuln-delta:
    needs: [update, open-pr]
    if: needs.update.outputs.changed == 'true'
    runs-on: nix
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: scan main, then the bump branch
        run: |
          set -eu
          base=$(git rev-parse main)
          head=$(git rev-parse origin/automated/flake-lock-bump)
          echo "base=$base" >> "$GITHUB_ENV"
          echo "head=$head" >> "$GITHUB_ENV"

          # isc comes from this flake's own pinned input, so the comment is
          # reproducible from the lock.
          nix run .#isc -- --repo . scan --ref "$base"
          nix run .#isc -- --repo . scan --ref "$head"

      - name: post the delta to the PR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          api="${SERVER}/api/v1/repos/${REPO}/pulls?state=open&limit=50"
          number=$(curl -sS -H "Authorization: token ${TOKEN}" "$api" \
            | jq -r '.[] | select(.head.ref=="automated/flake-lock-bump") | .number' | head -1)
          if [ -z "$number" ]; then
            echo "no open lock-bump PR to comment on"; exit 0
          fi
          FORGEJO_TOKEN="$TOKEN" nix run .#isc -- --repo . comment \
            --pr "$number" --from "$base" --to "$head"
